<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40">
  <!-- Eye/turbine icon -->
  <g transform="translate(4, 6)">
    <!-- Outer eye shape -->
    <path d="M0 14 Q14 2 28 14 Q14 26 0 14 Z" fill="none" stroke="#5A8F5A" stroke-width="2"/>
    <!-- Inner eye shape (smaller) -->
    <path d="M4 14 Q14 6 24 14 Q14 22 4 14 Z" fill="none" stroke="#5A8F5A" stroke-width="1.2"/>
    <!-- Iris circle -->
    <circle cx="14" cy="14" r="5" fill="none" stroke="#5A8F5A" stroke-width="1.5"/>
    <!-- Hub -->
    <circle cx="14" cy="14" r="1.8" fill="#5A8F5A"/>
    <!-- Blade up -->
    <line x1="14" y1="14" x2="14" y2="6" stroke="#5A8F5A" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Blade lower-right -->
    <line x1="14" y1="14" x2="20" y2="20" stroke="#5A8F5A" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Blade lower-left -->
    <line x1="14" y1="14" x2="8" y2="20" stroke="#5A8F5A" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Vertical separator -->
  <line x1="80" y1="8" x2="80" y2="32" stroke="#5A8F5A" stroke-width="1.5"/>
  <!-- Insight text -->
  <text x="90" y="26" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.8)" letter-spacing="0.5">Insight</text>
</svg>
