<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" width="320" height="56">
  <!-- Eye/turbine icon -->
  <g transform="translate(4, 4)">
    <!-- Outer eye shape (two leaves) -->
    <path d="M0 24 C8 6, 28 0, 40 24 C28 48, 8 42, 0 24 Z" fill="none" stroke="#5A8F5A" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Inner circle (iris ring) -->
    <circle cx="20" cy="24" r="9" fill="none" stroke="#5A8F5A" stroke-width="2"/>
    <!-- Hub center -->
    <circle cx="20" cy="24" r="2.5" fill="#5A8F5A"/>
    <!-- Blade up -->
    <line x1="20" y1="24" x2="20" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Blade lower-left -->
    <line x1="20" y1="24" x2="10" y2="35" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Blade lower-right -->
    <line x1="20" y1="24" x2="30" y2="35" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- CORE text -->
  <text x="58" y="37" font-family="Inter, system-ui, Arial, sans-serif" font-size="26" font-weight="800" fill="white" letter-spacing="1.5">CORE</text>
  <!-- Green vertical separator -->
  <line x1="164" y1="12" x2="164" y2="44" stroke="#5A8F5A" stroke-width="2"/>
  <!-- Insight text -->
  <text x="174" y="37" font-family="Inter, system-ui, Arial, sans-serif" font-size="22" font-weight="400" fill="#999999" letter-spacing="0.5">Insight</text>
</svg>
