<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <!-- Eye/turbine icon -->
  <g transform="translate(20, 12)">
    <!-- Outer eye shape -->
    <path d="M0 28 C12 8, 40 0, 56 28 C40 56, 12 48, 0 28Z" fill="none" stroke="#5A8F5A" stroke-width="4"/>
    <!-- Inner circle (iris) -->
    <circle cx="28" cy="28" r="12" fill="none" stroke="#5A8F5A" stroke-width="2.5"/>
    <!-- Pupil/hub -->
    <circle cx="28" cy="28" r="4" fill="#5A8F5A"/>
    <!-- Turbine blades inside eye -->
    <line x1="28" y1="28" x2="28" y2="14" stroke="#5A8F5A" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="16" y2="35" stroke="#5A8F5A" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="40" y2="35" stroke="#5A8F5A" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- CORE text -->
  <text x="92" y="50" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="2">CORE</text>
  <!-- Separator -->
  <line x1="225" y1="18" x2="225" y2="62" stroke="#5A8F5A" stroke-width="2"/>
  <!-- Insight text -->
  <text x="238" y="50" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="300" fill="#A0A0A0" letter-spacing="1">Insight</text>
</svg>
