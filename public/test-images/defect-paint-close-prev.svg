<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-paintp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CFD8DC"/>
      <stop offset="100%" style="stop-color:#ECEFF1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-paintp)"/>
  <!-- Blade surface -->
  <rect x="50" y="20" width="300" height="260" fill="#F5F5F5" rx="4"/>
  <!-- Minor paint peeling - single small area -->
  <path d="M 180 110 Q 195 105 210 112 Q 220 125 215 138 Q 200 145 185 140 Q 175 128 180 110 Z" fill="none" stroke="#A1887F" stroke-width="1"/>
  <path d="M 184 114 Q 196 110 206 115 Q 215 125 211 134 Q 199 140 188 136 Q 180 127 184 114 Z" fill="#FFF8E1" opacity="0.4"/>
  <!-- Single small chip -->
  <path d="M 250 170 L 260 167 L 263 177 L 253 179 Z" fill="none" stroke="#A1887F" stroke-width="0.8"/>
  <!-- Faint exposed substrate -->
  <circle cx="195" cy="122" r="2" fill="#BDBDBD" opacity="0.4"/>
  <!-- Scale -->
  <line x1="330" y1="105" x2="330" y2="145" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="105" x2="335" y2="105" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="145" x2="335" y2="145" stroke="#FF0000" stroke-width="1.5"/>
  <text x="330" y="128" text-anchor="middle" font-size="8" fill="#FF0000" font-family="sans-serif">40mm</text>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">Previous - Minor paint chip</text>
</svg>
