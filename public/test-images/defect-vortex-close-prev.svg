      <stop offset="0%" style="stop-color:#90CAF9"/>
      <stop offset="100%" style="stop-color:#E3F2FD"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-vxp)"/>
  <!-- Blade surface -->
  <rect x="80" y="20" width="240" height="260" fill="#F0F0F0" rx="3"/>
  <!-- VG panel positions - mostly present, only 1 missing -->
  <rect x="120" y="40" width="18" height="5" fill="#333" rx="1"/>
  <rect x="120" y="65" width="18" height="5" fill="#333" rx="1"/>
  <rect x="120" y="90" width="18" height="5" fill="#333" rx="1"/>
  <rect x="120" y="115" width="18" height="5" fill="#333" rx="1"/>
  <!-- Single missing VG - gap with faint adhesive residue -->
  <rect x="120" y="140" width="18" height="5" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <ellipse cx="129" cy="142" rx="4" ry="1.5" fill="#B8860B" opacity="0.2"/>
  <!-- Present VGs -->
  <rect x="120" y="165" width="18" height="5" fill="#333" rx="1"/>
  <rect x="120" y="190" width="18" height="5" fill="#333" rx="1"/>
  <rect x="120" y="215" width="18" height="5" fill="#333" rx="1"/>
  <rect x="120" y="240" width="18" height="5" fill="#333" rx="1"/>
  <!-- Red indicator for single missing -->
  <circle cx="155" cy="142" r="4" fill="none" stroke="#FF0000" stroke-width="1.5"/>
  <!-- Legend -->
  <rect x="230" y="50" width="12" height="4" fill="#333" rx="1"/>
  <text x="248" y="55" font-size="8" fill="#555" font-family="sans-serif">Present</text>
  <rect x="230" y="68" width="12" height="4" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2,1"/>
  <text x="248" y="73" font-size="8" fill="#555" font-family="sans-serif">Missing</text>
  <!-- Label -->
  <text x="200" y="285" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">Previous - Vortex generator missing (1)</text>
