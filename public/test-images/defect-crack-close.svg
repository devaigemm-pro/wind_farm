<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-crack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#607D8B"/>
      <stop offset="100%" style="stop-color:#90A4AE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-crack)"/>
  <!-- Blade surface close-up -->
  <rect x="60" y="20" width="280" height="260" fill="#E0E0E0" rx="3"/>
  <rect x="60" y="20" width="280" height="260" fill="#F5F5F5" opacity="0.4" rx="3"/>
  <!-- Main crack line -->
  <path d="M 180 40 L 185 70 L 178 100 L 190 130 L 175 165 L 188 200 L 180 235 L 185 260" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Branching micro-cracks -->
  <path d="M 185 70 L 200 80 L 205 75" fill="none" stroke="#333" stroke-width="1.2"/>
  <path d="M 178 100 L 165 108 L 160 115" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M 190 130 L 205 140 L 212 135" fill="none" stroke="#333" stroke-width="1.2"/>
  <path d="M 175 165 L 160 170 L 155 178" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M 188 200 L 202 210 L 210 208" fill="none" stroke="#333" stroke-width="1.2"/>
  <!-- Stress whitening around crack -->
  <path d="M 180 40 L 185 70 L 178 100 L 190 130 L 175 165 L 188 200 L 180 235 L 185 260" fill="none" stroke="#fff" stroke-width="6" opacity="0.3"/>
  <!-- Scale marker -->
  <line x1="330" y1="40" x2="330" y2="240" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="40" x2="335" y2="40" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="240" x2="335" y2="240" stroke="#FF0000" stroke-width="1.5"/>
  <text x="330" y="145" text-anchor="middle" font-size="8" fill="#FF0000" font-family="sans-serif">200mm</text>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#fff" font-family="sans-serif">Close-up - Structural crack</text>
</svg>
