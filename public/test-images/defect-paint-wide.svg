<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky-pw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90CAF9"/>
      <stop offset="100%" style="stop-color:#E3F2FD"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky-pw)"/>
  <!-- Blade -->
  <path d="M 90 270 Q 150 230 180 150 Q 200 80 215 20" fill="#D6D6D6" stroke="#999" stroke-width="1.5"/>
  <path d="M 120 270 Q 175 230 200 150 Q 218 80 230 20" fill="#EEEEEE" stroke="#999" stroke-width="1.5"/>
  <!-- Paint damage zones -->
  <ellipse cx="185" cy="135" rx="15" ry="20" fill="none" stroke="#FF9800" stroke-width="2"/>
  <ellipse cx="175" cy="180" rx="10" ry="12" fill="none" stroke="#FF9800" stroke-width="2"/>
  <!-- Discoloration patches -->
  <ellipse cx="185" cy="135" rx="10" ry="14" fill="#FFF9C4" opacity="0.4"/>
  <ellipse cx="175" cy="180" rx="7" ry="9" fill="#FFF9C4" opacity="0.3"/>
  <!-- Arrow -->
  <line x1="260" y1="120" x2="202" y2="133" stroke="#FF9800" stroke-width="1.5"/>
  <polygon points="202,133 209,126 210,136" fill="#FF9800"/>
  <text x="265" y="115" font-size="9" fill="#FF9800" font-family="sans-serif">Paint peeling</text>
  <!-- Ground -->
  <rect x="0" y="265" width="400" height="35" fill="#66BB6A" opacity="0.3"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">Wide view - Paint damage areas</text>
</svg>
