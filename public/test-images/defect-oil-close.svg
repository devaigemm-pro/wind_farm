<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-oil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0BEC5"/>
      <stop offset="100%" style="stop-color:#CFD8DC"/>
    </linearGradient>
    <radialGradient id="oil-stain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4E342E;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#6D4C41;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#8D6E63;stop-opacity:0.1"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-oil)"/>
  <!-- Blade surface -->
  <rect x="50" y="20" width="300" height="260" fill="#FAFAFA" rx="4"/>
  <!-- Main oil stain -->
  <ellipse cx="200" cy="130" rx="70" ry="45" fill="url(#oil-stain)"/>
  <!-- Oil drip streaks -->
  <path d="M 180 160 Q 178 190 175 220 Q 173 240 172 260" fill="none" stroke="#5D4037" stroke-width="3" opacity="0.4"/>
  <path d="M 200 165 Q 198 195 195 225 Q 193 245 192 265" fill="none" stroke="#5D4037" stroke-width="2.5" opacity="0.35"/>
  <path d="M 220 155 Q 219 185 217 215 Q 216 240 215 260" fill="none" stroke="#5D4037" stroke-width="2" opacity="0.3"/>
  <!-- Smaller secondary stain -->
  <ellipse cx="160" cy="200" rx="25" ry="18" fill="#6D4C41" opacity="0.3"/>
  <!-- Droplets -->
  <circle cx="240" cy="180" r="5" fill="#5D4037" opacity="0.4"/>
  <circle cx="255" cy="195" r="3" fill="#5D4037" opacity="0.35"/>
  <circle cx="145" cy="165" r="4" fill="#5D4037" opacity="0.45"/>
  <!-- Scale -->
  <line x1="330" y1="80" x2="330" y2="200" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="80" x2="335" y2="80" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="200" x2="335" y2="200" stroke="#FF0000" stroke-width="1.5"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">Close-up - Hydraulic oil contamination</text>
</svg>
