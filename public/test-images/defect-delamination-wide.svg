<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky-dw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81D4FA"/>
      <stop offset="100%" style="stop-color:#E1F5FE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky-dw)"/>
  <!-- Ground -->
  <rect x="0" y="260" width="400" height="40" fill="#8BC34A" opacity="0.4"/>
  <!-- Blade wide view -->
  <path d="M 80 260 Q 150 220 180 150 Q 200 80 210 15" fill="#BDBDBD" stroke="#888" stroke-width="1.5"/>
  <path d="M 115 260 Q 175 220 200 150 Q 220 80 230 15" fill="#E0E0E0" stroke="#888" stroke-width="1.5"/>
  <!-- Delamination zone highlight -->
  <ellipse cx="190" cy="140" rx="22" ry="35" fill="none" stroke="#FF6F00" stroke-width="2.5"/>
  <ellipse cx="190" cy="140" rx="30" ry="42" fill="none" stroke="#FF6F00" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <!-- Arrow and label -->
  <line x1="260" y1="100" x2="215" y2="125" stroke="#FF6F00" stroke-width="1.5"/>
  <polygon points="215,125 222,118 224,128" fill="#FF6F00"/>
  <text x="270" y="95" font-size="9" fill="#FF6F00" font-family="sans-serif">Delamination</text>
  <text x="270" y="107" font-size="8" fill="#FF6F00" font-family="sans-serif">~145mm extent</text>
  <!-- Nacelle hint -->
  <rect x="60" y="255" width="60" height="20" fill="#757575" rx="3" opacity="0.5"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">Wide view - Delamination on suction side</text>
</svg>
