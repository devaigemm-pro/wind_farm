<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-crackp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#607D8B"/>
      <stop offset="100%" style="stop-color:#90A4AE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-crackp)"/>
  <!-- Blade surface close-up -->
  <rect x="60" y="20" width="280" height="260" fill="#E0E0E0" rx="3"/>
  <rect x="60" y="20" width="280" height="260" fill="#F5F5F5" opacity="0.4" rx="3"/>
  <!-- Smaller, superficial crack - shorter and thinner than current -->
  <path d="M 185 100 L 182 125 L 188 150 L 183 175 L 186 195" fill="none" stroke="#444" stroke-width="1.5"/>
  <!-- Minor branching - single small branch -->
  <path d="M 188 150 L 198 155 L 200 152" fill="none" stroke="#555" stroke-width="0.8"/>
  <!-- Subtle stress whitening -->
  <path d="M 185 100 L 182 125 L 188 150 L 183 175 L 186 195" fill="none" stroke="#fff" stroke-width="3" opacity="0.15"/>
  <!-- Scale marker -->
  <line x1="330" y1="100" x2="330" y2="195" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="100" x2="335" y2="100" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="195" x2="335" y2="195" stroke="#FF0000" stroke-width="1.5"/>
  <text x="330" y="152" text-anchor="middle" font-size="8" fill="#FF0000" font-family="sans-serif">95mm</text>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#fff" font-family="sans-serif">Previous - Hairline crack (superficial)</text>
</svg>
