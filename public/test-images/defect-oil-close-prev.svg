<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-oilp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0BEC5"/>
      <stop offset="100%" style="stop-color:#CFD8DC"/>
    </linearGradient>
    <radialGradient id="oil-stain-p" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6D4C41;stop-opacity:0.4"/>
      <stop offset="60%" style="stop-color:#8D6E63;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#A1887F;stop-opacity:0.05"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-oilp)"/>
  <!-- Blade surface -->
  <rect x="50" y="20" width="300" height="260" fill="#FAFAFA" rx="4"/>
  <!-- Smaller oil stain - less spread -->
  <ellipse cx="200" cy="140" rx="35" ry="22" fill="url(#oil-stain-p)"/>
  <!-- Single short drip -->
  <path d="M 198 158 Q 197 175 196 190" fill="none" stroke="#6D4C41" stroke-width="1.5" opacity="0.2"/>
  <!-- Few small droplets -->
  <circle cx="215" cy="160" r="2.5" fill="#6D4C41" opacity="0.2"/>
  <circle cx="185" cy="150" r="2" fill="#6D4C41" opacity="0.25"/>
  <!-- Scale -->
  <line x1="330" y1="115" x2="330" y2="165" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="115" x2="335" y2="115" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="165" x2="335" y2="165" stroke="#FF0000" stroke-width="1.5"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">Previous - Small oil spot</text>
</svg>
