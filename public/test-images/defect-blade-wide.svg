<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A8C8E8"/>
      <stop offset="100%" style="stop-color:#D4E8D0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky2)"/>
  <!-- Landscape -->
  <ellipse cx="200" cy="280" rx="250" ry="60" fill="#5A8C4A"/>
  <ellipse cx="100" cy="270" rx="80" ry="40" fill="#4A7C3F"/>
  <ellipse cx="320" cy="275" rx="100" ry="45" fill="#4A7C3F"/>
  <!-- Turbine tower -->
  <rect x="185" y="80" width="12" height="180" fill="#E8E8E8"/>
  <!-- Nacelle -->
  <rect x="178" y="72" width="26" height="14" fill="#D0D0D0" rx="3"/>
  <!-- Blades -->
  <rect x="193" y="10" width="6" height="65" fill="#F0F0F0" rx="3" transform="rotate(-5, 196, 42)"/>
  <rect x="193" y="10" width="6" height="65" fill="#F5C4A8" rx="3" transform="rotate(115, 196, 80)"/>
  <rect x="193" y="10" width="6" height="65" fill="#F0F0F0" rx="3" transform="rotate(235, 196, 80)"/>
  <!-- Defect indicator on blade -->
  <line x="240" y1="95" x2="240" y2="140" stroke="#FF0000" stroke-width="1.5"/>
  <!-- Second turbine (background) -->
  <rect x="320" y="140" width="6" height="110" fill="#CCC" opacity="0.6"/>
  <circle cx="323" cy="138" r="25" fill="none" stroke="#CCC" stroke-width="1" opacity="0.4"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">Wide view - Turbine with defect</text>
</svg>
