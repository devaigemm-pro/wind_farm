<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky-ow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#78909C"/>
      <stop offset="100%" style="stop-color:#CFD8DC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky-ow)"/>
  <!-- Blade wide view -->
  <path d="M 80 270 Q 150 230 180 150 Q 200 80 210 20" fill="#BDBDBD" stroke="#888" stroke-width="1.5"/>
  <path d="M 110 270 Q 170 230 195 150 Q 215 80 225 20" fill="#E0E0E0" stroke="#888" stroke-width="1.5"/>
  <!-- Oil streak from root -->
  <path d="M 125 250 Q 145 225 155 195 Q 165 170 168 150" fill="none" stroke="#5D4037" stroke-width="4" opacity="0.4"/>
  <path d="M 130 255 Q 148 228 158 200 Q 167 175 170 155" fill="none" stroke="#5D4037" stroke-width="2.5" opacity="0.3"/>
  <!-- Oil zone highlight -->
  <ellipse cx="150" cy="200" rx="20" ry="35" fill="none" stroke="#FF6F00" stroke-width="2"/>
  <!-- Arrow -->
  <line x1="240" y1="180" x2="172" y2="198" stroke="#FF6F00" stroke-width="1.5"/>
  <polygon points="172,198 180,192 179,202" fill="#FF6F00"/>
  <text x="245" y="175" font-size="9" fill="#FF6F00" font-family="sans-serif">Oil contamination</text>
  <text x="245" y="187" font-size="8" fill="#FF6F00" font-family="sans-serif">from pitch system</text>
  <!-- Ground -->
  <rect x="0" y="265" width="400" height="35" fill="#6D4C41" opacity="0.2"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">Wide view - Hydraulic oil on blade</text>
</svg>
