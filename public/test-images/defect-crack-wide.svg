<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky-cw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6"/>
      <stop offset="100%" style="stop-color:#BBDEFB"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky-cw)"/>
  <!-- Blade wide view -->
  <path d="M 100 280 Q 180 250 200 150 Q 210 80 215 20" fill="#D0D0D0" stroke="#999" stroke-width="1"/>
  <path d="M 130 280 Q 200 250 220 150 Q 230 80 235 20" fill="#E8E8E8" stroke="#999" stroke-width="1"/>
  <!-- Crack location indicator -->
  <circle cx="210" cy="130" r="18" fill="none" stroke="#FF0000" stroke-width="2.5" stroke-dasharray="4,3"/>
  <circle cx="210" cy="130" r="25" fill="none" stroke="#FF0000" stroke-width="1" opacity="0.5"/>
  <!-- Arrow pointing to crack -->
  <line x1="270" y1="90" x2="228" y2="120" stroke="#FF0000" stroke-width="1.5"/>
  <polygon points="228,120 234,112 236,122" fill="#FF0000"/>
  <text x="285" y="88" font-size="9" fill="#FF0000" font-family="sans-serif">Crack location</text>
  <!-- Hub hint -->
  <circle cx="90" cy="280" r="15" fill="#666" opacity="0.5"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">Wide view - Crack on blade surface</text>
</svg>
