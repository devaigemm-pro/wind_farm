<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-paint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CFD8DC"/>
      <stop offset="100%" style="stop-color:#ECEFF1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-paint)"/>
  <!-- Blade surface -->
  <rect x="50" y="20" width="300" height="260" fill="#F5F5F5" rx="4"/>
  <!-- Paint peeling patterns -->
  <path d="M 140 60 Q 160 55 180 65 Q 195 80 185 100 Q 165 110 145 100 Q 130 85 140 60 Z" fill="none" stroke="#795548" stroke-width="1.5"/>
  <path d="M 145 65 Q 162 60 175 68 Q 188 80 180 95 Q 165 103 150 96 Q 137 83 145 65 Z" fill="#FFF8E1" opacity="0.7"/>
  <!-- Another peeling zone -->
  <path d="M 200 130 Q 230 120 260 135 Q 275 155 265 180 Q 240 195 210 185 Q 190 165 200 130 Z" fill="none" stroke="#795548" stroke-width="1.5"/>
  <path d="M 208 137 Q 232 128 255 140 Q 268 155 260 175 Q 238 187 215 180 Q 198 163 208 137 Z" fill="#FFF8E1" opacity="0.6"/>
  <!-- Chips and flakes -->
  <path d="M 150 170 L 165 165 L 170 180 L 155 185 Z" fill="none" stroke="#795548" stroke-width="1"/>
  <path d="M 280 70 L 295 65 L 300 80 L 285 82 Z" fill="none" stroke="#795548" stroke-width="1"/>
  <ellipse cx="120" cy="200" rx="12" ry="8" fill="none" stroke="#795548" stroke-width="1"/>
  <!-- Exposed substrate dots -->
  <circle cx="160" cy="80" r="3" fill="#9E9E9E" opacity="0.6"/>
  <circle cx="235" cy="155" r="4" fill="#9E9E9E" opacity="0.5"/>
  <circle cx="225" cy="165" r="2.5" fill="#9E9E9E" opacity="0.6"/>
  <!-- Scale -->
  <line x1="330" y1="60" x2="330" y2="180" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="60" x2="335" y2="60" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="325" y1="180" x2="335" y2="180" stroke="#FF0000" stroke-width="1.5"/>
  <text x="330" y="125" text-anchor="middle" font-size="8" fill="#FF0000" font-family="sans-serif">120mm</text>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">Close-up - Paint damage / peeling</text>
</svg>
