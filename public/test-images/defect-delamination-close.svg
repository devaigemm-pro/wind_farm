<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-delam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#78909C"/>
      <stop offset="100%" style="stop-color:#B0BEC5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-delam)"/>
  <!-- Blade surface -->
  <rect x="50" y="30" width="300" height="240" fill="#ECEFF1" rx="4"/>
  <!-- Delamination area - separated layers -->
  <path d="M 130 80 Q 200 70 270 85 Q 290 120 275 160 Q 220 180 150 170 Q 120 140 130 80 Z" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1.5"/>
  <!-- Lifted layer with shadow -->
  <path d="M 140 90 Q 200 82 260 92 Q 278 120 265 150 Q 215 168 155 160 Q 130 135 140 90 Z" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1" opacity="0.8"/>
  <!-- Inner exposed layer -->
  <path d="M 160 105 Q 200 98 240 108 Q 255 125 245 145 Q 210 155 170 150 Q 150 135 160 105 Z" fill="#FFF9C4" stroke="#F9A825" stroke-width="1" opacity="0.7"/>
  <!-- Layer separation lines -->
  <path d="M 135 88 Q 145 85 155 88" fill="none" stroke="#666" stroke-width="0.8" stroke-dasharray="2,2"/>
  <path d="M 260 92 Q 270 100 275 110" fill="none" stroke="#666" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- Measurement -->
  <line x1="130" y1="210" x2="275" y2="210" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="130" y1="205" x2="130" y2="215" stroke="#FF0000" stroke-width="1.5"/>
  <line x1="275" y1="205" x2="275" y2="215" stroke="#FF0000" stroke-width="1.5"/>
  <text x="200" y="225" text-anchor="middle" font-size="9" fill="#FF0000" font-family="sans-serif">145mm</text>
  <!-- Label -->
  <text x="200" y="285" text-anchor="middle" font-size="10" fill="#333" font-family="sans-serif">Close-up - Delamination area</text>
</svg>
