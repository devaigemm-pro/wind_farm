<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F0FF"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D44A00"/>
      <stop offset="40%" style="stop-color:#E8734A"/>
      <stop offset="100%" style="stop-color:#F5A882"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <!-- Blade close-up -->
  <rect x="120" y="20" width="80" height="260" fill="url(#blade)" rx="4"/>
  <rect x="200" y="20" width="100" height="260" fill="#F5C4A8" rx="4"/>
  <!-- Defect markers (red lines) -->
  <line x1="160" y1="60" x2="160" y2="240" stroke="#FF0000" stroke-width="2"/>
  <line x1="165" y1="40" x2="165" y2="250" stroke="#FF0000" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Scale reference -->
  <rect x="195" y="30" width="3" height="240" fill="#FF0000" opacity="0.7"/>
  <!-- VG markers -->
  <rect x="125" y="80" width="15" height="4" fill="#333" opacity="0.6"/>
  <rect x="125" y="120" width="15" height="4" fill="#333" opacity="0.6"/>
  <rect x="125" y="160" width="15" height="4" fill="#333" opacity="0.3"/>
  <rect x="125" y="200" width="15" height="4" fill="#333" opacity="0.6"/>
  <!-- Background hint of landscape -->
  <rect x="0" y="250" width="400" height="50" fill="#4A7C3F" opacity="0.3"/>
  <!-- Label -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#555" font-family="sans-serif">Close-up view - Blade defect</text>
</svg>
