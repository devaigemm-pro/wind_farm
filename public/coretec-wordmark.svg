    <circle cx="12" cy="12" r="4" fill="rgba(76,175,80,0.2)" stroke="#4CAF50" stroke-width="1"/>
    <!-- Hub -->
    <circle cx="12" cy="12" r="1.5" fill="#4CAF50"/>
