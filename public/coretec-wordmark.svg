  </g>
  
  <!-- CORE -->
  <text x="30" y="23" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="white" letter-spacing="1">CORE</text>
  
  <!-- Space -->
  
  <!-- Insight -->
  <text x="96" y="23" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.8)" letter-spacing="0.5">Insight</text>
</svg>
