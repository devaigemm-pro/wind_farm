<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="32" height="32">
  <!-- Background circle - dark blue -->
  <circle cx="100" cy="100" r="96" fill="#0B2545" stroke="#4CAF50" stroke-width="3"/>
  
  <!-- Eye shape (insight) - outer -->
  <path d="M30 100 Q100 45 170 100 Q100 155 30 100 Z" fill="none" stroke="#4CAF50" stroke-width="4" opacity="0.9"/>
  
  <!-- Eye shape - inner fill -->
  <path d="M40 100 Q100 55 160 100 Q100 145 40 100 Z" fill="rgba(76,175,80,0.1)"/>
  
  <!-- Iris circle -->
  <circle cx="100" cy="100" r="30" fill="#4CAF50" opacity="0.2" stroke="#4CAF50" stroke-width="2"/>
  
  <!-- Pupil - turbine hub -->
  <circle cx="100" cy="100" r="6" fill="#4CAF50"/>
  <circle cx="100" cy="100" r="3.5" fill="#0B2545"/>
  
  <!-- Turbine blades inside the eye (as pupil detail) -->
  <!-- Blade 1 - top -->
  <path d="M100 100 C99 92, 98.5 82, 99 74 C99.3 72, 100.7 72, 101 74 C101.5 82, 101 92, 100 100" fill="white" opacity="0.9"/>
  <!-- Blade 2 - bottom-right -->
  <path d="M100 100 C107 105, 115 112, 121 117 C122.5 118, 122 119.5, 120.5 118.5 C114 114, 106 107, 100 100" fill="white" opacity="0.9"/>
  <!-- Blade 3 - bottom-left -->
  <path d="M100 100 C93 105, 85 112, 79 117 C77.5 118, 78 119.5, 79.5 118.5 C86 114, 94 107, 100 100" fill="white" opacity="0.9"/>
  
  <!-- Scan lines (data/insight effect) -->
  <line x1="45" y1="85" x2="70" y2="85" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
  <line x1="130" y1="85" x2="155" y2="85" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
  <line x1="45" y1="115" x2="70" y2="115" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
  <line x1="130" y1="115" x2="155" y2="115" stroke="#4CAF50" stroke-width="1" opacity="0.4"/>
</svg>
